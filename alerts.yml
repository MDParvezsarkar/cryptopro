name: Crypto alerts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crypto-alerts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Binance and send Telegram alerts
        run: node alerts.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: SMC spot signals (Smart Money Concepts)
        if: always()
        run: node smc.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "alerts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json signals.json
          git diff --cached --quiet || (git commit -m "update alert state" && (git push || (git pull --rebase && git push)))
